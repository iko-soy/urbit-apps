[package]
name = "jammer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Pack desk directories into .deskjam files for the deskjam Urbit app, and unpack them"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
rustix = { version = "1", features = ["fs"] }
